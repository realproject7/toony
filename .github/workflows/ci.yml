name: CI

# Backstop for the release gate: run the full check + test suite on every push
# to main and every pull request, on both supported Node majors. `pnpm check`
# (Biome + typecheck + public-safety + no-stub) is kept fast for pre-commit and
# does NOT run the tests itself (#157); this workflow is what guarantees a red
# test suite cannot merge unnoticed.

on:
  push:
    branches: [main]
  pull_request:

# Supersede in-flight runs for the same ref so a new push cancels the old run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: check + test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # Report both Node majors independently instead of stopping at the first.
      fail-fast: false
      matrix:
        node: ["20", "24"]
    steps:
      - uses: actions/checkout@v4

      # action-setup reads the pinned pnpm version from package.json
      # (`packageManager`), so CI and local use the same pnpm.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm test
